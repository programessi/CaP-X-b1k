# Usage:
#   python capx/envs/launch.py --config-path env_configs/x2/x2_tabletop_tcp_reach.yaml
#
# This is the first intentionally small X2 task wrapper.  The policy / oracle
# code should only call injected APIs; scene, robot, target marker, support, and
# camera are created here.

env:
  _target_: capx.envs.tasks.x2.x2_tabletop_tcp_reach.X2TabletopTcpReachCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level:
      _target_: capx.envs.simulators.x2_b1k.X2BehaviourLowLevel
      controller_cfg: x2_robotiq85_primitives.yaml
      objects:
        - type: PrimitiveObject
          name: x2_reach_support
          primitive_type: Cube
          size: 1.0
          scale: [0.08, 0.08, 0.012]
          position: [0.34, -0.188, 0.925]
          orientation: [0, 0, 0, 1]
          fixed_base: true
          rgba: [0.35, 0.35, 0.35, 1.0]
        - type: PrimitiveObject
          name: x2_reach_target_marker
          primitive_type: Sphere
          radius: 0.012
          position: [0.34, -0.188, 0.943]
          orientation: [0, 0, 0, 1]
          fixed_base: true
          kinematic_only: true
          visual_only: true
          rgba: [1.0, 0.04, 0.03, 1.0]
      external_sensors:
        - sensor_type: VisionSensor
          name: global_camera
          relative_prim_path: /global_camera
          modalities: [rgb, depth_linear]
          sensor_kwargs:
            image_height: 384
            image_width: 384
          position: [0.85, -1.05, 1.45]
          orientation: [0.467415, 0.155805, 0.275181, 0.825544]
      load_object_categories: [floors, ceilings, walls]
      robot_camera_arm: 1
      robot_camera_resolution: 256
      robot_obs_modalities: [rgb, depth, depth_linear]
    privileged: false
    apis:
      - X2ControlApi

record_video: true
output_dir: ./outputs/x2_tabletop_tcp_reach

trials: 1
resume_idx: 1
num_workers: 1
use_oracle_code: true
use_visual_feedback: false
use_img_differencing: false
